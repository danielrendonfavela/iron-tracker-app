name: Deploy UAT Environment

on:
  push:
    branches:
      - uat

jobs:
  deploy_uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_UAT }}
          VITE_FIREBASE_AUTH_DOMAIN: iron-tracker-uat.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: iron-tracker-uat
          VITE_FIREBASE_STORAGE_BUCKET: iron-tracker-uat.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "441504779004"
          VITE_FIREBASE_APP_ID: "1:441504779004:web:5cca51cca281beb379a579"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRON_TRACKER_UAT }}'
          channelId: live
          projectId: iron-tracker-uat
